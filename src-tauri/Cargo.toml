[package]
name = "azprose"
version = "0.1.0"
description = "AZprose — éditeur de texte scientifique"
authors = ["Sadik Boujaida <ibouja@gmail.com>", "Anthropic Claude <claude@anthropic.com>"]
edition = "2021"

[lib]
name = "azprose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
calamine = { version = "0.26", features = ["dates"] }
chrono = "0.4"
fontdb = "0.23"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["process", "fs", "net", "rt-multi-thread"] }
portable-pty = "0.9"
lettre = "0.11"
base64 = "0.22"
headless_chrome = { version = "1.0.22", features = ["fetch"] }
url = "2"
rmcp = { version = "3.1.2", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8.9"
tokio-util = "0.7.19"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.7"

[dev-dependencies]
tempfile = "3.27.0"
