<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- PAS de règle .material-icons ici (phase 2.2) : propre au tableur,
         importée uniquement dans Spreadsheet.svelte — NAV ne monte jamais
         de tableur (R8, lecture seule). -->
    <title>AZprose</title>

    <style>
      /* Boot screen — painted before any JS bundle loads. IDENTIQUE à
         index.html — duplication ASSUMÉE (hors périmètre de la phase 2.5,
         qui ne régénère que les tables BG/LIGHT ci-dessous, seule partie
         dérivée de themes.json ; ces règles CSS statiques n'ont pas de
         source séparée à générer). */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.28s ease;
        background: #1e1e2e;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot-track {
        width: 200px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255,255,255,0.12);
        overflow: hidden;
      }
      #boot-fill {
        height: 100%;
        width: 45%;
        border-radius: 2px;
        background: rgba(255,255,255,0.36);
        animation: boot-slide 1.15s cubic-bezier(0.4, 0, 0.55, 1) infinite;
      }
      @keyframes boot-slide {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(260%);  }
      }
    </style>
    <!-- Pas de config MathJax ici : source unique désormais src/shell/boot.ts
         (initBoot(), appelé par nav-main.ts avant tout rendu — phase 2.2). -->
  </head>
  <body>
    <!-- Boot screen lives outside #root, painted before Svelte mounts.
         The coloring script must come AFTER this div so getElementById works. -->
    <div id="boot">
      <div id="boot-track">
        <div id="boot-fill"></div>
      </div>
    </div>

    <script>
      /* Runs synchronously right after #boot is parsed: colors it from the
         persisted theme before a single byte of the app bundle executes. */
      (function () {
        /* GÉNÉRÉ par scripts/build-themes.mjs depuis themes.json — NE PAS
           éditer les tables BG/LIGHT ci-dessous à la main (vague 2, phase
           2.5). Éditer src/styles/themes.json, puis `bun run themes`. */
        var BG = {
          latte:                   '#eff1f5',
          frappe:                  '#303446',
          macchiato:               '#24273a',
          mocha:                   '#1e1e2e',
          'skarline-fleet-dark':   '#18191B',
          'skarline-fleet-light':  '#FFFFFF',
          'skarline-fleet-purple': '#1C1827',
          'skarline-xcode-dark':   '#292a30',
          'skarline-xcode-light':  '#ffffff',
        };
        var LIGHT = {
          latte: 1, 'skarline-fleet-light': 1, 'skarline-xcode-light': 1,
        };
        /* /GÉNÉRÉ */
        var t = '';
        try { t = localStorage.getItem('mdview.theme') || ''; } catch (e) {}
        if (t === 'system' || !BG[t]) {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'mocha' : 'latte';
        }
        var light = !!LIGHT[t];
        document.getElementById('boot').style.background       = BG[t];
        document.getElementById('boot-track').style.background = light ? 'rgba(0,0,0,0.10)' : 'rgba(255,255,255,0.12)';
        document.getElementById('boot-fill').style.background  = light ? 'rgba(0,0,0,0.28)'  : 'rgba(255,255,255,0.36)';
      })();
    </script>
    <script>
      /* UI font override from localStorage — always sets --*-temp so
         tokens.css only needs var(--font-ui-temp) without fallback.
         IDENTIQUE à index.html — duplication ASSUMÉE (pas de source dérivée
         de themes.json ici, hors périmètre de la phase 2.5). */
      (function () {
        try {
          function readJson(key) {
            try { return JSON.parse(localStorage.getItem(key) || "null"); }
            catch (e) { return null; }
          }
          var UI_FONTS = {
            inter: '"Inter", "Ubuntu", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
            ubuntu: '"Ubuntu", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
            'ubuntu-condensed': '"Ubuntu Condensed", "Ubuntu", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
            system: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
          };
          var UI_MONO_FONTS = {
            'jetbrains-mono': '"JetBrains Mono", "Ubuntu Mono", ui-monospace, SFMono-Regular, Menlo, monospace',
            'ubuntu-mono': '"Ubuntu Mono", ui-monospace, SFMono-Regular, Menlo, monospace',
            system: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
          };
          var f = readJson('mdview.ui.font');
          document.documentElement.style.setProperty('--font-ui-temp',
            (f && (UI_FONTS[f] || f)) || '"Ubuntu", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif');
          var m = readJson('mdview.ui.mono.font');
          document.documentElement.style.setProperty('--font-mono-temp',
            (m && (UI_MONO_FONTS[m] || m)) || '"Ubuntu Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace');
          /* Preview (HTML rendering) fonts — resolve preset ids to stacks
             so boot matches the store's applyPreviewFont(). */
          var PREVIEW_FONTS = {
            'fira-sans': '"Fira Sans", "Inter", "Ubuntu", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
            inter: '"Inter", "Ubuntu", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
            ubuntu: '"Ubuntu", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
            'ubuntu-condensed': '"Ubuntu Condensed", "Ubuntu", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
            system: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
          };
          var PREVIEW_MONO_FONTS = {
            'fira-code': '"Fira Code", "Ubuntu Mono", ui-monospace, SFMono-Regular, Menlo, monospace',
            'jetbrains-mono': '"JetBrains Mono", "Ubuntu Mono", ui-monospace, SFMono-Regular, Menlo, monospace',
            'ubuntu-mono': '"Ubuntu Mono", ui-monospace, SFMono-Regular, Menlo, monospace',
            system: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
          };
          var pf = readJson('mdview.preview.font') || 'fira-sans';
          var pc = readJson('mdview.preview.font.custom') || '';
          var pm = readJson('mdview.preview.mono.font') || 'fira-code';
          document.documentElement.style.setProperty('--font-preview-temp',
            pf === 'custom'
              ? (pc ? '"' + pc + '", "Ubuntu", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
                    : PREVIEW_FONTS['fira-sans'])
              : PREVIEW_FONTS[pf] || PREVIEW_FONTS['fira-sans']);
          document.documentElement.style.setProperty('--font-preview-mono-temp',
            PREVIEW_MONO_FONTS[pm] || PREVIEW_MONO_FONTS['fira-code']);
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/nav-main.ts"></script>
  </body>
</html>
