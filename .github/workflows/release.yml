name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustTargets: x86_64-unknown-linux-gnu
          # `universal-apple-darwin` et non `aarch64` seul : macos-latest est un
          # runner ARM, une build native n'aurait livré QUE les Mac Apple
          # Silicon. Le binaire universel exige les DEUX cibles Rust installées.
          - platform: macos-latest
            target: universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rustTargets: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: bun install

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # `--target` : sans lui, la cible de la matrice était installée puis
          # jamais transmise — les trois lignes buildaient pour leur hôte, par
          # coïncidence. C'est ce qui rend la matrice réelle (cf. universal
          # macOS, qui ne peut PAS sortir d'une build par défaut).
          args: --target ${{ matrix.target }}
          # Sur `workflow_dispatch`, `github.ref_name` vaut le nom de branche :
          # une release « master » serait créée. tagName vide = build seule,
          # sans release ; les bundles restent récupérables en artefacts.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: true
          # Le signal « bêta » vit ICI, pas dans le numéro de version : un
          # suffixe `-beta` casse le bundle MSI (WiX n'accepte qu'un identifiant
          # de pré-version NUMÉRIQUE) et le `0.x` de semver dit déjà
          # « instable ». À repasser à false pour la 1.0.
          prerelease: true
          uploadWorkflowArtifacts: true
          # `bundle.createUpdaterArtifacts` est à false et aucune clé de
          # signature n'est fournie : il n'y a ni .sig ni latest.json à publier.
          # À rebasculer à true le jour où TAURI_SIGNING_PRIVATE_KEY existe.
          uploadUpdaterJson: false
          # Le téléchargement des outils AppImage est régulièrement instable.
          retryAttempts: 2
